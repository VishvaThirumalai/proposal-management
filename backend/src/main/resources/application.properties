# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.servlet.context-path=/api

# ==========================================
# CORS Configuration (if needed)
# ==========================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/startuphub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Vishva6051!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Security Configuration
# ==========================================
jwt.secret=startuphub-very-secure-secret-key-256-bits-long-for-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true

# ==========================================
# IPFS Configuration
# ==========================================
ipfs.api.url=http://localhost:5001
ipfs.gateway.url=http://localhost:8080/ipfs/

# ==========================================
# AI Service Configuration
# ==========================================
ai.service.url=http://localhost:8000

# ==========================================
# ✅ Embedding Service Configuration (ADD THIS!)
# ==========================================
embedding.service.url=http://localhost:8000

# ==========================================
# Logging
# ==========================================
logging.level.com.startuphub=DEBUG
logging.level.org.hibernate=INFO

# ==========================================
# Email Configuration - GMAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vishva2730@gmail.com
spring.mail.password=lyhvrxbacwjv
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Error Configuration (CORRECTED)
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# ==========================================
# Blockchain Configuration
# ==========================================
blockchain.enabled=true
blockchain.network.config=src/main/resources/fabric/connection-profile.yaml
blockchain.channel.name=mychannel
blockchain.chaincode.name=startuphub